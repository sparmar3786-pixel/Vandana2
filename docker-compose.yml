version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        EXPOSE 8000
        CMD ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: python:3.11-slim
    working_dir: /app
    command: ["python", "-m", "http.server", "5173", "-d", "/app/frontend"]
    volumes:
      - ./frontend:/app/frontend:ro
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  # optional: run the NSE MCP server over SSE alongside the backend
  nse-mcp:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        CMD ["python", "-m", "backend.mcp.nse_mcp_server", "--transport", "sse", "--port", "8765"]
    env_file:
      - .env
    ports:
      - "8765:8765"
    profiles: ["mcp"]
    restart: unless-stopped

# ---------- Point 4: container orchestration ----------
# Backend, frontend and optional NSE MCP services are isolated into
# separate containers. Live orders remain controlled by .env flags.
