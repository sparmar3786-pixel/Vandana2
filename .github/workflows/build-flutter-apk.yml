name: Build NSE-AI-TERMINAL APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'flutter_app/**'
      - 'backend/**'
      - '.github/workflows/build-flutter-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: flutter_app
        run: flutter create --platforms=android --org com.nseaiterminal .

      - name: Add release INTERNET permission
        working-directory: flutter_app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('    <application', permission + '\\n    <application', 1)
              p.write_text(text)
          PY

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Validate Python syntax
        run: python -m compileall -q backend

      - name: Analyze Dart
        working-directory: flutter_app
        run: flutter analyze

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nse-ai-terminal-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
