name: Deploy Vandana2 backend to Oracle Cloud

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4

      - name: Package application
        run: |
          tar --exclude=.git --exclude=.env --exclude='data/*' -czf vandana2.tar.gz .

      - name: Install SSH key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.ORACLE_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload application bundle
        run: |
          scp vandana2.tar.gz "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}:/tmp/vandana2.tar.gz"

      - name: Release on Oracle VM
        run: |
          ssh "${{ secrets.ORACLE_USER }}@${{ secrets.ORACLE_HOST }}" '
            set -e
            APP_DIR="${ORACLE_APP_DIR:-$HOME/vandana2}"
            mkdir -p "$APP_DIR"
            tar -xzf /tmp/vandana2.tar.gz -C "$APP_DIR"
            rm -f /tmp/vandana2.tar.gz
            test -f "$APP_DIR/deploy/oracle/docker-compose.yml"
            test -f "$APP_DIR/deploy/oracle/.env"
            cd "$APP_DIR/deploy/oracle"
            docker compose up -d --build
            docker compose ps
          '
