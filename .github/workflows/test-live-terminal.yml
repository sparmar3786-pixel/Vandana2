name: Live terminal tests

on:
  push:
    branches:
      - main
      - feature/live-terminal-integration
  pull_request:

jobs:
  # Live integration regression gate
  test-live-terminal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall backend
      - run: pytest -q tests/test_live_terminal.py
