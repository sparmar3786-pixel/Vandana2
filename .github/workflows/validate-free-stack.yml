name: Vandana2 free-stack validation

on:
  push:
    branches:
      - feature/free-edge-6ai-stack
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m compileall backend
      - run: pytest -q
